<!DOCTYPE html>
<html lang="en">
<head>
  <title>Unban Request Form</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      background-color: #fff;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #333;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .form-group textarea {
      resize: vertical;
      height: 100px;
    }
    .btn {
      display: inline-block;
      background-color: #5cb85c;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }
    .btn:hover {
      background-color: #4cae4c;
    }
    .alert {
      padding: 20px;
      background-color: #4caf50;
      color: white;
      margin-bottom: 15px;
    }
  </style>
  <script>
    function showAlert(message) {
      var alertDiv = document.createElement('div');
      alertDiv.className = 'alert';
      alertDiv.innerText = message;
      document.body.insertBefore(alertDiv, document.body.firstChild);
      setTimeout(function() {
        alertDiv.remove();
      }, 3000);
    }
  </script>
</head>
<body>

<div class="container">
  <h2>Unban Request Form</h2>
  <form method="POST" action="{{ url_for('unban.unban_request') }}">
    {{ form.hidden_tag() }}
    <div class="form-group">
      <label for="first_name">{{ form.first_name.label }}</label>
      {{ form.first_name(id='first_name') }}
    </div>
    <div class="form-group">
      <label for="last_name">{{ form.last_name.label }}</label>
      {{ form.last_name(id='last_name') }}
    </div>
    <div class="form-group">
      <label for="email">{{ form.email.label }}</label>
      {{ form.email(id='email') }}
    </div>
    <div class="form-group">
      <label for="reason">{{ form.reason.label }}</label>
      {{ form.reason(id='reason') }}
    </div>
    <div class="form-group">
      {{ form.submit(class="btn") }}
    </div>
  </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        showAlert("{{ message }}");
      {% endfor %}
    {% endif %}
  {% endwith %}
});
</script>

</body>
</html>
