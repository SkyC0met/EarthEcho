<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Posts</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/myposts.css') }}">
</head>
<body>
    {% include "navbar/user_navbar.html" %}
    {% include "user/customerBase.html" %}

    <div class="container-md mt-sm-5 mt-4 mb-5">
        <h2 class="fw-bold">My Posts</h2>

        <div class="posts-container mt-sm-5 mt-4">
            <div class="row align-items-center">
                {% for post in posts %}
                    <div class="col-md-4 mb-3 d-flex justify-content-center">
                        <div class="post-card">
                            <img src="data:image/jpeg;base64,{{ post[2] }}" alt="Post Image" class="post-image">
                            <div class="post-content d-flex align-items-center justify-content-between my-2">
                                <h5 class="fw-bold">{{ post[1] }}</h5>
                                <p><a href="{{ url_for('view.view_post', post_id=post[0]) }}" class="view-post-link">View Post</a></p>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
