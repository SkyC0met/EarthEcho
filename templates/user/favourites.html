<!--SKY HTML-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favourites</title>
  </head>

  <body>
    {% include "navbar/user_navbar.html" %}
    {% include "user/customerBase.html" %}
    <!--FAVOURITES-->
    <div class="container-md mt-sm-5 mt-4 mb-5">
      <h2 class="fw-bold">Favourites</h2>

      <div class="container mt-sm-5 mt-4 p-0">
        <div class="row align-items-center">
          {% for favourite in favourites %}
          <div class="col-xl-2 col-lg-3 col-sm-4 col-6 mb-3 d-flex justify-content-center">
            <div class="card fav-card">
              <img
                src="{{ url_for('static', filename=favourite.image_path) }}"
                class="card-img-top"
                alt="..."
              />
              <div class="card-body p-2">
                <div
                  class="d-flex align-items-center justify-content-between my-2"
                >
                  <h5 class="fw-bold">{{ favourite.header }}</h5>

                  <form method="POST" action="{{ url_for('reward.add_points') }}">
                    {{ add_favourites_form.csrf_token }}
                    <i
                      class="fa-solid fa-heart fa-xl mx-3 icon-red"
                      type="submit"
                    ></i>
                  </form>
                </div>
                <p class="mt-4 short-text">{{ favourite.body }}</p>
              </div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
    <!--FAVOURITES-->
  </body>
</html>
