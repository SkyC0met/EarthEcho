<!--SKY HTML-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favourites</title>

    <script>
      function submitFavouriteForm(postId, isFavourite) {
          var form = document.getElementById('favourite-form-' + postId);
          var action = isFavourite === 'true' ? "{{ url_for('fav.remove_favourite') }}" : "{{ url_for('fav.add_favourite') }}";
          form.action = action;
          form.submit();

          var heart = form.querySelector('.fa-heart');
          heart.classList.toggle('fa-solid');
          heart.classList.toggle('fa-regular');
      }

      function toggleFavourite(event) {
          event.stopPropagation();
          event.preventDefault();
          var heart = event.currentTarget;
          var postId = heart.getAttribute('data-post-id');
          var isFavourite = heart.getAttribute('data-is-favourite');
          submitFavouriteForm(postId, isFavourite);
      }
    </script>
  </head>

  <body>
    {% include "navbar/user_navbar.html" %}
    {% include "user/customerBase.html" %}
    <!--FAVOURITES-->
    <div class="container-md mt-sm-5 mt-4 mb-5">
      <h2 class="fw-bold">Favourites</h2>

      <div class="container mt-sm-5 mt-4 p-0">
        <div class="row align-items-center">
          {% for favourite in favourites %}
          <div class="col-xl-2 col-lg-3 col-sm-4 col-6 mb-3 d-flex justify-content-center">
            <a href="{{ url_for('init.blog') }}">
              <div class="card fav-card">
                <img
                  src="{{ url_for('static', filename=favourite.image_path) }}"
                  class="card-img-top"
                  alt="..."
                />
                <div class="card-body p-2">
                  <div
                    class="d-flex align-items-center justify-content-between my-2"
                  >
                    <h5 class="fw-bold short-text">{{ favourite.header }}</h5>
  
                    <form id="favourite-form-1" action="{{ url_for('fav.add_favourite') }}" method="POST">
                      {{ add_favourites_form.csrf_token }}
                      {{ add_favourites_form.post_id(value=1) }}
                      <i id="favourite-heart-{{ favourite.post_id }}" class="fa-heart fa-xl icon-red {% if is_favourite %}fa-regular{% else %}fa-solid{% endif %}" type="button" data-post-id="{{ favourite.post_id }}" data-is-favourite="{% if is_favourite %}false{% else %}true{% endif %}" onclick="toggleFavourite(event);"></i>
                    </form>
                  </div>
                  <p class="mt-4 short-text">{{ favourite.body }}</p>
                </div>
              </div>
            </a>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
    <!--FAVOURITES-->
  </body>
</html>
