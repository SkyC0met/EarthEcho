<!--SKY HTML-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favourites</title>

    <script src="../../static/js/fav.js"></script>
  </head>

  <body>
    {% include "navbar/user_navbar.html" %}
    {% include "user/customerBase.html" %}
    <!--FAVOURITES-->
    <div class="container-md mt-sm-5 mt-4 mb-5">
      <h2 class="fw-bold">Favourites</h2>

      <div class="container mt-sm-5 mt-4 p-0">
        <div class="row align-items-center">
          {% for favourite in favourites %}
          <div class="col-xl-2 col-lg-3 col-sm-4 col-6 mb-3 d-flex justify-content-center">
            <a href="{{ url_for('bp.post', post_id=favourite.post_id) }}">
              <div class="card fav-card">
                <img
                  src="data:image/png;base64,{{ favourite.image_data }}"
                  class="card-img-top"
                  alt="{{ favourite.header }}"
                />
                <div class="card-body p-2">
                  <h5 class="fw-bold short-text my-2">{{ favourite.header }}</h5>
                  <p class="mt-4 short-text">{{ favourite.body }}</p>
                </div>
              </div>
            </a>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
    <!--FAVOURITES-->
  </body>
</html>
