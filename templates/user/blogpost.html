<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/blogpost.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    {% include "user/customerBase.html" %}
    {% include "navbar/user_navbar.html" %}

    <div class="content">
        <h1><b>Blog Name</b></h1>
        <p>Blog content</p>

        <!-- hidden inputs for JavaScript pagination -->
        <input type="hidden" id="currentPage" value="{{ current_page }}">
        <input type="hidden" id="reviewsPerPage" value="{{ reviews_per_page }}">
        <input type="hidden" id="totalReviews" value="{{ total_reviews }}">

        <div class="item product-review">
            <h3><b>Product Review</b></h3>

            <!-- avg rating -->
            <div id="ratingSummary">
                <p><span id="averageRating">0</span></p>
                <div class="chart-container">
                    <canvas id="ratingChart"></canvas>
                </div>
            </div>

            <div id="reviews"></div>

            <!-- Show More button -->
            {% if reviews|length > 0 and reviews|length < total_reviews %}
                <div class="pt-3">
                    <button id="showMoreBtn" type="button" class="btn btn-secondary">Show More</button>
                </div>
            {% endif %}

            <hr class="solid">

            <!-- Add Review Form -->
            <h3><b>Add Review</b></h3>
            <form id="reviewForm" method="POST" action="{{ url_for('review.submit_review') }}">
                <!-- CSRF Token -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group mb-4">
                    <div class="rating-wrapper">
                        <p>Rating:</p>
                        <img id="1" src="{{ url_for('static', filename='images/star.png') }}" width="20">
                        <img id="2" src="{{ url_for('static', filename='images/star.png') }}" width="20">
                        <img id="3" src="{{ url_for('static', filename='images/star.png') }}" width="20">
                        <img id="4" src="{{ url_for('static', filename='images/star.png') }}" width="20">
                        <img id="5" src="{{ url_for('static', filename='images/star.png') }}" width="20">
                        <button type="button" onclick="clearStarRating()" class="btn btn-primary">Clear</button>
                    </div>
                    <input type="hidden" id="rating" name="rating" value="">
                </div>

                <div class="form-group">
                    <label for="review">Write your review:</label>
                    <textarea name="review" id="review" rows="5" class="form-control" placeholder="Enter your review..." required></textarea>
                </div>
                <div class="pt-3">
                    <button type="submit" class="btn btn-secondary">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/review.js') }}"></script>
</body>
</html>
