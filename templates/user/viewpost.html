<!DOCTYPE html>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/blogpost.css') }}">
    <title>View Post</title>
  </head>
  <body>
    {% include "navbar/user_navbar.html" %} {% include "user/customerBase.html" %}
    {% block content %}
      <div class="container-md mt-sm-5 mt-4 mb-5">
        <h2 class="fw-bold">View Post</h2>
        <div>
            <h2>{{ post.title }}</h2> <!-- Header -->
            <p>Posted by {{ post.username }} on {{ post.timestamp }}</p>
            <p>Topic: {{ post.topic }}</p>
            <img src="data:image/png;base64,{{ post.image }}" alt="Post Image"> <!-- Image -->
            <p>{{ post.body }}</p> <!-- Body Text -->
            <!-- Edit Button -->
            <a href="{{ url_for('edit.edit_post', post_id=post.post_id) }}" class="btn btn-primary">Edit</a>
            <!-- Delete Button -->
            <form method="POST" action="{{ url_for('delete.delete_post', post_id=post.post_id) }}" onsubmit="return confirm('Are you sure you want to delete this post?');">
                {{ csrf_token() }}  <!-- CSRF Token -->
                <button type="submit" class="btn btn-danger">Delete</button>
            </form>

        </div>
    {% endblock %}
